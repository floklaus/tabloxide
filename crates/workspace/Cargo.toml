[package]
name = "tabloxide-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
notify = "8"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.28", features = ["derive"], optional = true }
tabloxide-core = { version = "0.1.0", path = "../core" }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"

[lints]
workspace = true

[features]
specta = ["dep:specta", "tabloxide-core/specta"]
