[package]
name = "tabloxide-adapter-duckdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
# `bundled` compiles DuckDB from source. `parquet` and `json` put these two
# extensions into the build, so that DuckDB does not get them from the network.
duckdb = { version = "=1.20000.2", features = ["bundled", "parquet", "json"] }
# `preserve_order` keeps the fields of a plan in the sequence of the engine.
serde_json = { version = "1", features = ["preserve_order"] }
tabloxide-core = { version = "0.1.0", path = "../core" }
tokio = { version = "1.54.1", features = ["sync", "time"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
