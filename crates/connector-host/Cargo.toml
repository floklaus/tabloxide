[package]
name = "tabloxide-connector-host"
description = "Finds, checks, and starts the database connectors of Tabloxide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
flate2 = "1.1.11"
minisign-verify = "0.3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
specta = { version = "=2.0.0-rc.28", features = ["derive"], optional = true }
tabloxide-connector-protocol = { version = "0.1.0", path = "../connector-protocol" }
tabloxide-core = { version = "0.1.0", path = "../core" }
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
toml = "1.2.1"
tonic = { version = "0.14.9", default-features = false, features = ["codegen", "transport", "channel"] }
uuid = { version = "1.26.1", features = ["v4"] }

[features]
specta = ["dep:specta", "tabloxide-core/specta"]

[dev-dependencies]
tabloxide-connector-sdk = { version = "0.1.0", path = "../connector-sdk" }
tabloxide-core = { version = "0.1.0", path = "../core", features = ["testing"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
