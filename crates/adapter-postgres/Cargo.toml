[package]
name = "tabloxide-adapter-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
tabloxide-core = { version = "0.1.0", path = "../core" }
tokio = { version = "1.54.1", features = ["rt", "time", "net"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", features = ["ring"] }

[lints]
workspace = true

[dev-dependencies]
testcontainers-modules = { version = "0.13.0", features = ["postgres"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
