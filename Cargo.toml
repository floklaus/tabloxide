[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Each test executable contains a full copy of the application. With full debug data,
# the build folder grew to more than 70 GB. Line tables keep the file names and the
# line numbers in a panic message, but a debugger cannot show the values of variables.
# The test profile uses the settings of this profile.
[profile.dev]
debug = "line-tables-only"

# DuckDB is C++ code that this workspace compiles from source. Without optimization
# and with debug data, the development build is very large and its queries are slow.
[profile.dev.package.libduckdb-sys]
opt-level = 2
debug = false
