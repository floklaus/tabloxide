[package]
name = "tabloxide"
description = "Cross-platform SQL client with built-in Git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "tabloxide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
specta = "=2.0.0-rc.28"
specta-typescript = "0.0.15"
tabloxide-adapter-duckdb = { version = "0.1.0", path = "../crates/adapter-duckdb" }
tabloxide-adapter-postgres = { version = "0.1.0", path = "../crates/adapter-postgres" }
tabloxide-connector-host = { version = "0.1.0", path = "../crates/connector-host", features = ["specta"] }
tabloxide-assistant = { version = "0.1.0", path = "../crates/assistant", features = ["specta"] }
tabloxide-core = { version = "0.1.0", path = "../crates/core", features = ["specta"] }
tabloxide-git = { version = "0.1.0", path = "../crates/git", features = ["specta"] }
tabloxide-workspace = { version = "0.1.0", path = "../crates/workspace", features = ["specta"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-window-state = "2"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "sync"] }
serde_json = "1.0.154"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
async-trait = "0.1"
serde_json = "1"
tabloxide-core = { version = "0.1.0", path = "../crates/core", features = ["specta", "testing"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
