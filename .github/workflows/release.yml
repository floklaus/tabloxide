name: Release

# A tag such as v0.1.0 builds the installers for the three platforms and makes a
# draft release with the installers, their SHA-256 checksums, and the release notes.
# The release notes are the section of the version in CHANGELOG.md.
#
# Each of these parts is active only when the repository has its secrets.
# Without them, the workflow makes installers without a signature and without updates.
# docs/release.md tells how to make the keys and the certificates.
#
#   Update files:   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#                   and the repository variable TAURI_UPDATER_PUBKEY
#   macOS:          APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#                   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows:        WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
#
# A manual run (Actions › Release › Run workflow) builds the installers for one
# platform or for all platforms. It makes no release. The installers are the
# artifacts of the run.
# The builds of this workflow run on GitHub-hosted runners, also for Linux. The
# Linux installer must run on glibc 2.35 (Ubuntu 22.04). A build on the
# self-hosted runner would need the glibc of the server. Refer to
# docs/self-hosted-runner.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: macos-latest
        options:
          - macos-latest
          - ubuntu-22.04
          - windows-latest
          - all

permissions:
  contents: read

jobs:
  build:
    name: Build installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # macos-latest runs on Apple silicon, so the macOS installer is for arm64 (M1 and newer).
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.platform != 'all') && format('["{0}"]', inputs.platform) || '["ubuntu-22.04", "macos-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev build-essential curl file

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # The updater settings go into the build only with the signing key. Without the
      # key, the build cannot sign the update files, and the application has no updater.
      - name: Prepare the update files
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$PUBKEY" ]; then
            echo "No updater signing key or public key. The release has no update files."
            echo '{}' > updater-config.json
            exit 0
          fi
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<END_OF_KEY"
            echo "$SIGNING_KEY"
            echo "END_OF_KEY"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          jq -n --arg pubkey "$PUBKEY" --arg endpoint "$ENDPOINT" '{
            bundle: { createUpdaterArtifacts: true },
            plugins: { updater: { pubkey: $pubkey, endpoints: [$endpoint] } }
          }' > updater-config.json

      # Tauri signs and notarises the application when these variables have values.
      - name: Prepare the macOS signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate. The macOS application has no signature."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "The secret $name is missing." >&2
              exit 1
            fi
            {
              echo "$name<<END_OF_VALUE"
              echo "$value"
              echo "END_OF_VALUE"
            } >> "$GITHUB_ENV"
          done

      # The certificate goes into the certificate store of the runner. Tauri signs the
      # installers and the executable with the thumbprint of the certificate.
      - name: Prepare the Windows signature
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "No Windows certificate. The installers have no signature."
            '{}' | Set-Content windows-config.json
            exit 0
          }
          $path = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $path
          @{ bundle = @{ windows = @{
            certificateThumbprint = $certificate.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 4 | Set-Content windows-config.json

      - name: Build the application
        shell: bash
        run: |
          args=(--config updater-config.json)
          if [ -f windows-config.json ]; then
            args+=(--config windows-config.json)
          fi
          pnpm tauri build "${args[@]}"

      - name: Collect the installers
        shell: bash
        run: |
          mkdir installers
          find target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} installers/ \;
          # The macOS update file has no version and no architecture in its name.
          # The update manifest needs the architecture.
          for file in installers/*.app.tar.gz; do
            [ -e "$file" ] || continue
            arch="$(uname -m | sed 's/arm64/aarch64/')"
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              version="${GITHUB_REF_NAME#v}"
            else
              version="dev-${GITHUB_SHA::7}"
            fi
            target="installers/Tabloxide_${version}_${arch}.app.tar.gz"
            mv "$file" "$target"
            if [ -e "$file.sig" ]; then mv "$file.sig" "$target.sig"; fi
          done
          ls -l installers
          test -n "$(ls -A installers)"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: installers/
          if-no-files-found: error

  publish:
    name: Publish the draft release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the release notes of this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v version="$version" '
            /^## / { found = ($2 == version) ; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section with the title \"## $version\"." >&2
            exit 1
          fi
          cat release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The application reads this file to find a newer version.
      - name: Write the update manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! ls installers/*.sig > /dev/null 2>&1; then
            echo "The release has no signed update files. It has no update manifest."
            exit 0
          fi
          node scripts/updater-manifest.mjs \
            --dir installers \
            --version "$TAG" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --notes-file release-notes.md > installers/latest.json
          cat installers/latest.json

      - name: Write the checksums
        working-directory: installers
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Make the draft release
        working-directory: installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Tabloxide $TAG" --notes-file ../release-notes.md -- *
