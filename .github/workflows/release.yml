name: Release

# A tag such as v0.1.0 builds the installers for the three platforms and makes a
# draft release with the installers, their SHA-256 checksums, and the release notes.
# The release notes are the section of the version in CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev build-essential curl file

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the application
        run: pnpm tauri build

      - name: Collect the installers
        shell: bash
        run: |
          mkdir installers
          find target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} installers/ \;
          ls -l installers
          test -n "$(ls -A installers)"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: installers/
          if-no-files-found: error

  publish:
    name: Publish the draft release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the release notes of this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v version="$version" '
            /^## / { found = ($2 == version) ; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section with the title \"## $version\"." >&2
            exit 1
          fi
          cat release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      - name: Write the checksums
        working-directory: installers
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Make the draft release
        working-directory: installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Tabloxide $TAG" --notes-file ../release-notes.md -- *
