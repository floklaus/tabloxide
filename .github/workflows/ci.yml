name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            executable: target/release/tabloxide
          - os: macos-latest
            executable: target/release/tabloxide
          - os: windows-latest
            executable: target/release/tabloxide.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev build-essential curl file xvfb

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Check format
        if: runner.os == 'Linux'
        run: pnpm format:check

      - name: Lint and type check the UI
        run: |
          pnpm --dir ui lint
          pnpm typecheck

      - name: Test the UI
        run: pnpm --dir ui test

      - name: Build the UI
        run: pnpm --dir ui build

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --workspace

      # The Linux runner has Docker. The macOS and Windows runners do not run these tests.
      - name: Test the PostgreSQL adapter against a real server
        if: runner.os == 'Linux'
        run: cargo test -p tabloxide-adapter-postgres -- --ignored

      - name: Check that the TypeScript bindings are current
        run: git diff --exit-code -- ui/src/bindings.ts

      - name: Build the application
        run: pnpm tauri build

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-start.mjs ${{ matrix.executable }}

      - name: Smoke test (macOS and Windows)
        if: runner.os != 'Linux'
        run: node scripts/smoke-start.mjs ${{ matrix.executable }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: tabloxide-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*-setup.exe
          if-no-files-found: error
