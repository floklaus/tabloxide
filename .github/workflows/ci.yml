name: CI

# A push, a manual start, and a pull request from this repository run the Linux
# job on the self-hosted runner (refer to docs/self-hosted-runner.md). A pull
# request from a fork runs on a GitHub-hosted runner, so that code from other
# people never runs on the server.
#
# macOS and Windows minutes are expensive. Their jobs run only when you start the
# workflow by hand with "All platforms", and in the release workflow on a tag.
#
# Each job has a fixed runs-on value. With an expression in runs-on, GitHub did
# not start the run while the account had no free minutes ("startup_failure").
# The probable cause: GitHub could not see that the job needs no GitHub-hosted
# runner.
# The steps are in .github/actions/build-and-test.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all-platforms:
        description: Also build and test on macOS and Windows
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Build and test (Linux)
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: [self-hosted, linux, tabloxide]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-and-test
        with:
          artifact-name: tabloxide-linux
          executable: target/release/tabloxide

  linux-fork:
    name: Build and test (Linux, pull request from a fork)
    if: ${{ github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-and-test
        with:
          artifact-name: tabloxide-linux
          executable: target/release/tabloxide

  macos:
    name: Build and test (macOS)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.all-platforms }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-and-test
        with:
          artifact-name: tabloxide-macos
          executable: target/release/tabloxide

  windows:
    name: Build and test (Windows)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.all-platforms }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-and-test
        with:
          artifact-name: tabloxide-windows
          executable: target/release/tabloxide.exe
