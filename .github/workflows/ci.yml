name: CI

# A push and a pull request run the Linux job on the self-hosted runner (refer to
# docs/self-hosted-runner.md). A pull request from a fork runs on a GitHub-hosted
# runner, so that code from other people never runs on the server.
#
# macOS and Windows minutes are expensive. Their jobs run only when you start the
# workflow by hand with "All platforms", and in the release workflow on a tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all-platforms:
        description: Also build and test on macOS and Windows
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    # Linux: the self-hosted runner, except for a pull request from a fork.
    runs-on: ${{ (matrix.os != 'linux' && matrix.os) || (github.event.pull_request.head.repo.fork && 'ubuntu-22.04') || fromJSON('["self-hosted", "linux", "tabloxide"]') }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.all-platforms) && '["linux", "macos-latest", "windows-latest"]' || '["linux"]') }}
    env:
      EXECUTABLE: ${{ matrix.os == 'windows-latest' && 'target/release/tabloxide.exe' || 'target/release/tabloxide' }}
    steps:
      - uses: actions/checkout@v4

      # The self-hosted runner has these libraries. Its user has no sudo.
      - name: Install Linux system libraries
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev build-essential curl file xvfb

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Check format
        if: runner.os == 'Linux'
        run: pnpm format:check

      - name: Lint and type check the UI
        run: |
          pnpm --dir ui lint
          pnpm typecheck

      - name: Test the UI
        run: pnpm --dir ui test

      - name: Test the release scripts
        run: node --test scripts/*.test.mjs

      - name: Build the UI
        run: pnpm --dir ui build

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --workspace

      # The Linux runners have Docker. The macOS and Windows runners do not run these tests.
      - name: Test the PostgreSQL adapter against a real server
        if: runner.os == 'Linux'
        run: cargo test -p tabloxide-adapter-postgres -- --ignored

      - name: Test the MongoDB connector against a real server
        if: runner.os == 'Linux'
        run: cargo test -p tabloxide-connector-mongodb -- --ignored

      - name: Check that the TypeScript bindings are current
        run: git diff --exit-code -- ui/src/bindings.ts

      - name: Build the application
        run: pnpm tauri build

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-start.mjs "$EXECUTABLE"

      - name: Smoke test (macOS and Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: node scripts/smoke-start.mjs "$EXECUTABLE"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: tabloxide-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*-setup.exe
          if-no-files-found: error
