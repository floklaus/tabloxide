# The steps of CI after the checkout. Each job of ci.yml uses them, so that the
# jobs can have a fixed runs-on value. Refer to the comment in ci.yml.
name: Build and test
description: Lint, test, and build the application, and upload the installers.

inputs:
  artifact-name:
    description: Name of the artifact with the installers
    required: true
  executable:
    description: Path of the built program for the smoke test, relative to the Cargo target folder
    required: true

runs:
  using: composite
  steps:
    # The self-hosted runner has these libraries. Its user has no sudo.
    - name: Install Linux system libraries
      if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
          librsvg2-dev libssl-dev libxdo-dev build-essential curl file xvfb

    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    # A GitHub-hosted runner starts empty. It gets the Rust build from the GitHub cache.
    - uses: Swatinem/rust-cache@v2
      if: runner.environment == 'github-hosted'

    # The self-hosted runner keeps the Rust build between jobs, in a folder outside
    # the workspace. actions/checkout cleans the workspace and would delete target/.
    # One runner does one job at a time. Cargo also locks the folder during a build.
    # The step clears the folder when the Rust version changes, or when the folder
    # is larger than the limit, because old build files stay in it.
    - name: Choose the Cargo target folder
      shell: bash
      run: |
        if [ "$RUNNER_ENVIRONMENT" != self-hosted ]; then
          echo "TARGET_DIR=target" >> "$GITHUB_ENV"
          exit 0
        fi
        dir="$HOME/.cache/tabloxide-ci/target"
        stamp="$HOME/.cache/tabloxide-ci/rustc-version"
        version="$(rustc -vV)"
        if [ -d "$dir" ] && [ "$(cat "$stamp" 2>/dev/null)" != "$version" ]; then
          echo "The Rust version changed. Clearing $dir."
          rm -rf "$dir"
        fi
        if [ -d "$dir" ]; then
          size_gb="$(du -s --block-size=1G "$dir" | cut -f1)"
          echo "The Cargo target folder has $size_gb GB."
          if [ "$size_gb" -gt "$TARGET_LIMIT_GB" ]; then
            echo "The folder is larger than $TARGET_LIMIT_GB GB. Clearing $dir."
            rm -rf "$dir"
          fi
        fi
        mkdir -p "$dir"
        printf '%s' "$version" > "$stamp"
        {
          echo "CARGO_TARGET_DIR=$dir"
          echo "TARGET_DIR=$dir"
          echo "CARGO_INCREMENTAL=0"
        } >> "$GITHUB_ENV"
      env:
        TARGET_LIMIT_GB: '40'

    - name: Install Node dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Check format
      if: runner.os == 'Linux'
      shell: bash
      run: pnpm format:check

    - name: Lint and type check the UI
      shell: bash
      run: |
        pnpm --dir ui lint
        pnpm typecheck

    - name: Test the UI
      shell: bash
      run: pnpm --dir ui test

    - name: Test the release scripts
      shell: bash
      run: node --test scripts/*.test.mjs

    - name: Build the UI
      shell: bash
      run: pnpm --dir ui build

    - name: Lint Rust
      shell: bash
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Test Rust
      shell: bash
      run: cargo test --workspace

    # The Linux runners have Docker. The macOS and Windows runners do not run these tests.
    - name: Test the PostgreSQL adapter against a real server
      if: runner.os == 'Linux'
      shell: bash
      run: cargo test -p tabloxide-adapter-postgres -- --ignored

    - name: Test the MongoDB connector against a real server
      if: runner.os == 'Linux'
      shell: bash
      run: cargo test -p tabloxide-connector-mongodb -- --ignored

    - name: Check that the TypeScript bindings are current
      shell: bash
      run: git diff --exit-code -- ui/src/bindings.ts

    - name: Build the application
      shell: bash
      run: pnpm tauri build

    - name: Smoke test (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: xvfb-run -a node scripts/smoke-start.mjs "$TARGET_DIR/$EXECUTABLE"
      env:
        EXECUTABLE: ${{ inputs.executable }}

    - name: Smoke test (macOS and Windows)
      if: runner.os != 'Linux'
      shell: bash
      run: node scripts/smoke-start.mjs "$TARGET_DIR/$EXECUTABLE"
      env:
        EXECUTABLE: ${{ inputs.executable }}

    - name: Upload installers
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ env.TARGET_DIR }}/release/bundle/**/*.deb
          ${{ env.TARGET_DIR }}/release/bundle/**/*.rpm
          ${{ env.TARGET_DIR }}/release/bundle/**/*.AppImage
          ${{ env.TARGET_DIR }}/release/bundle/**/*.dmg
          ${{ env.TARGET_DIR }}/release/bundle/**/*.msi
          ${{ env.TARGET_DIR }}/release/bundle/**/*-setup.exe
        if-no-files-found: error
