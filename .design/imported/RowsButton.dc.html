<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Results bar with Ask about these rows</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit}
</style>
</helmet>
<div style="width: 760px; height: 220px; padding: 8px; background: #eceef2; color: #1b1f27; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; line-height: 1.4; display: flex">
<section aria-label="Results" style="flex-grow: 1; min-width: 0; background: #ffffff; border: 1px solid #e1e4ea; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden">
<table style="width: 100%; border-collapse: collapse; font-size: 13px">
<thead><tr style="background: #f4f5f7; text-align: left"><th style="padding: 6px 10px; font-weight: 600">customer_id</th><th style="padding: 6px 10px; font-weight: 600">name</th><th style="padding: 6px 10px; font-weight: 600">revenue</th><th style="padding: 6px 10px; font-weight: 600">discounts</th></tr></thead>
<tbody>
<tr style="border-top: 1px solid #e1e4ea"><td style="padding: 6px 10px">1042</td><td style="padding: 6px 10px">Ada</td><td style="padding: 6px 10px">12 480.00</td><td style="padding: 6px 10px">320.00</td></tr>
<tr style="border-top: 1px solid #e1e4ea"><td style="padding: 6px 10px">1043</td><td style="padding: 6px 10px">Bo</td><td style="padding: 6px 10px">9 912.50</td><td style="padding: 6px 10px">0.00</td></tr>
</tbody>
</table>
<span style="flex-grow: 1"></span>
<div style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 8px 10px; border-top: 1px solid #e1e4ea">
<span role="status" style="color: #5b6472; font-size: 12px">3 812 rows (42 ms)</span>
<span style="flex-grow: 1"></span>
<button type="button" title="Ask the AI a question about the rows of this result. A confirmation comes first." style="height: 28px; padding: 0 10px; border: 1px solid #d5d9e0; border-radius: 6px; background: #ffffff; color: #1b1f27; font-size: 12px; display: inline-flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>Ask about these rows</button>
<button type="button" style="height: 28px; padding: 0 10px; border: 1px solid #d5d9e0; border-radius: 6px; background: #ffffff; color: #1b1f27; font-size: 12px">Export CSV</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":220}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
