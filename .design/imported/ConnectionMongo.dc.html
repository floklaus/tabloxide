<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New connection: MongoDB</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit}
</style>
</helmet>
<div style="width: 720px; height: 820px; padding: 24px; background: rgba(27, 31, 39, 0.35); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; line-height: 1.4; display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-label="New connection" style="width: 100%; padding: 24px; border-radius: 14px; background: #ffffff; color: #1b1f27; box-shadow: 0 12px 32px rgba(27, 31, 39, 0.18); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 8px"><h2 style="margin: 0; font-size: 18px; font-weight: 600">New connection</h2><span style="flex-grow: 1"></span><button type="button" aria-label="Close" title="Close" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><path d="M6 6l12 12 M18 6L6 18" stroke="#5b6472" stroke-width="1.75" fill="none" stroke-linecap="round"></path></svg></button></div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px">
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600">Database engine</span>
<select style="height: 32px; padding: 0 10px; border: 1px solid #7f8898; border-radius: 6px; background: #ffffff; color: #1b1f27"><option>MongoDB</option></select>
<span style="display: flex; align-items: center; gap: 6px; color: #5b6472; font-size: 12px">Connector [0.1.0]<span style="padding: 0 8px; border-radius: 999px; background: #eef8f1; color: #15803d; font-size: 11px; font-weight: 600">Official</span></span></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600">Name</span>
<input type="text" value="Product catalog" style="height: 32px; padding: 0 10px; border: 1px solid #7f8898; border-radius: 6px; background: #ffffff; color: #1b1f27"></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600">Host</span>
<input type="text" value="localhost" style="height: 32px; padding: 0 10px; border: 1px solid #7f8898; border-radius: 6px; background: #ffffff; color: #1b1f27"></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600">Port</span>
<input type="text" value="27017" style="height: 32px; padding: 0 10px; border: 1px solid #7f8898; border-radius: 6px; background: #ffffff; color: #1b1f27">
<span style="color: #5b6472; font-size: 12px">An SRV record uses no port.</span></label>
<label style="grid-column: 1 / 3; display: flex; align-items: flex-start; gap: 8px"><input type="checkbox" style="margin: 3px 0 0"><span style="display: flex; flex-direction: column; gap: 2px"><span>SRV record (Atlas)</span><span style="color: #5b6472; font-size: 12px">Get the hosts from the DNS name. MongoDB Atlas uses this.</span></span></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600">Database</span>
<input type="text" value="shop" style="height: 32px; padding: 0 10px; border: 1px solid #7f8898; border-radius: 6px; background: #ffffff; color: #1b1f27"></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600">Auth source</span>
<input type="text" value="admin" style="height: 32px; padding: 0 10px; border: 1px solid #7f8898; border-radius: 6px; background: #ffffff; color: #1b1f27">
<span style="color: #5b6472; font-size: 12px">The database that has the user.</span></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600">User (optional)</span>
<input type="text" value="ada" style="height: 32px; padding: 0 10px; border: 1px solid #7f8898; border-radius: 6px; background: #ffffff; color: #1b1f27"></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600">Password</span>
<input type="password" value="placeholder" autocomplete="off" style="height: 32px; padding: 0 10px; border: 1px solid #7f8898; border-radius: 6px; background: #ffffff; color: #1b1f27"></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600">TLS mode</span>
<select style="height: 32px; padding: 0 10px; border: 1px solid #7f8898; border-radius: 6px; background: #ffffff; color: #1b1f27"><option>Verify full (encrypt and verify the certificate)</option></select></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600">Environment</span>
<select style="height: 32px; padding: 0 10px; border: 1px solid #7f8898; border-radius: 6px; background: #ffffff; color: #1b1f27"><option>Development</option><option>Staging</option><option>Production</option></select></label>
</div>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 10px; background: #fafbfc; border: 1px solid #e1e4ea; font-size: 13px">
<span>The editor uses the MongoDB shell syntax. For example:</span>
<code style="font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace; font-size: 12px; color: #1b1f27">db.users.find({ age: { $gt: 30 } })</code>
<span style="color: #5b6472; font-size: 12px">Tabloxide runs no JavaScript.</span>
</div>

<div style="display: flex; align-items: center; gap: 8px">
<span style="flex-grow: 1"></span>
<button type="button" style="height: 32px; padding: 0 12px; border-radius: 6px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; border: 1px solid #d5d9e0; background: #ffffff; color: #1b1f27">Cancel</button>
<button type="button" style="height: 32px; padding: 0 12px; border-radius: 6px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; border: 1px solid #d5d9e0; background: #ffffff; color: #1b1f27">Test the connection</button>
<button type="button" style="height: 32px; padding: 0 12px; border-radius: 6px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; border: 1px solid #2563eb; background: #2563eb; color: #ffffff; font-weight: 600">Save</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":820}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
