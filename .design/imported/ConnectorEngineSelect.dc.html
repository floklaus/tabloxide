<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New connection: select the engine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit}
</style>
</helmet>
<div style="width: 720px; height: 760px; padding: 24px; background: rgba(27, 31, 39, 0.35); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; line-height: 1.4; display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-label="New connection" style="width: 100%; padding: 24px; border-radius: 14px; background: #ffffff; color: #1b1f27; box-shadow: 0 12px 32px rgba(27, 31, 39, 0.18); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 8px"><h2 style="margin: 0; font-size: 18px; font-weight: 600">New connection</h2><span style="flex-grow: 1"></span><button type="button" aria-label="Close" title="Close" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><path d="M6 6l12 12 M18 6L6 18" stroke="#5b6472" stroke-width="1.75" fill="none" stroke-linecap="round"></path></svg></button></div>

<div style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px">
<div style="display: flex; flex-direction: column; gap: 4px"><span id="engine-label" style="font-size: 12px; font-weight: 600">Database engine</span>
<button type="button" aria-haspopup="listbox" aria-expanded="true" aria-labelledby="engine-label" style="height: 32px; padding: 0 10px; border: 2px solid #2563eb; border-radius: 6px; background: #ffffff; color: #1b1f27; display: flex; align-items: center; gap: 8px; text-align: left"><span style="flex-grow: 1">PostgreSQL</span><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" stroke="#5b6472" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></div>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600">Name</span>
<input type="text" value="" placeholder="For example: Local shop" style="height: 32px; padding: 0 10px; border: 1px solid #7f8898; border-radius: 6px; background: #ffffff; color: #1b1f27"></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600">Host</span>
<input type="text" value="localhost" style="height: 32px; padding: 0 10px; border: 1px solid #7f8898; border-radius: 6px; background: #ffffff; color: #1b1f27"></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600">Port</span>
<input type="text" value="5432" style="height: 32px; padding: 0 10px; border: 1px solid #7f8898; border-radius: 6px; background: #ffffff; color: #1b1f27"></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600">Database</span>
<input type="text" value="" style="height: 32px; padding: 0 10px; border: 1px solid #7f8898; border-radius: 6px; background: #ffffff; color: #1b1f27"></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600">User</span>
<input type="text" value="" style="height: 32px; padding: 0 10px; border: 1px solid #7f8898; border-radius: 6px; background: #ffffff; color: #1b1f27"></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600">Environment</span>
<select style="height: 32px; padding: 0 10px; border: 1px solid #7f8898; border-radius: 6px; background: #ffffff; color: #1b1f27"><option>Development</option><option>Staging</option><option>Production</option></select></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600">Password source</span>
<select style="height: 32px; padding: 0 10px; border: 1px solid #7f8898; border-radius: 6px; background: #ffffff; color: #1b1f27"><option>Credential store of the operating system</option></select></label>

<div role="listbox" aria-label="Database engine" style="position: absolute; top: 58px; left: 0; width: 380px; padding: 6px; border-radius: 10px; background: #ffffff; border: 1px solid #e1e4ea; box-shadow: 0 12px 32px rgba(27, 31, 39, 0.18); display: flex; flex-direction: column; gap: 1px">
<div role="presentation" style="padding: 8px 10px 4px; color: #5b6472; font-size: 12px; font-weight: 600">Built in</div>
<div role="option" aria-selected="true" style="min-height: 36px; display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 6px; background: #f1f3f6; font-size: 13px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#1b1f27" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="flex-grow: 1; font-weight: 600">PostgreSQL</span></div>
<div role="option" aria-selected="false" style="min-height: 36px; display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 6px; font-size: 13px"><span aria-hidden="true" style="width: 14px"></span><span style="flex-grow: 1">DuckDB</span><span style="color: #5b6472; font-size: 12px">File on this computer</span></div>
<div role="separator" style="height: 1px; margin: 4px 6px; background: #e1e4ea"></div>
<div role="presentation" style="padding: 8px 10px 4px; color: #5b6472; font-size: 12px; font-weight: 600">Connectors</div>
<div role="option" aria-selected="false" style="min-height: 36px; display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 6px; font-size: 13px; outline: 2px solid #2563eb; outline-offset: -2px"><span aria-hidden="true" style="width: 14px"></span><span style="flex-grow: 1">MongoDB</span><span style="display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 999px; background: #eaf1fe; color: #1d4ed8; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24"><path d="M12 4v11 M7 10l5 5 5-5 M5 20h14" stroke="#1d4ed8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>Download, [14 MB]</span></div>
<div role="separator" style="height: 1px; margin: 4px 6px; background: #e1e4ea"></div>
<div role="option" aria-selected="false" style="min-height: 36px; display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 6px; font-size: 13px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z M14 3v4h4" stroke="#5b6472" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="flex-grow: 1">Install a connector from a file…</span></div>
<p style="margin: 4px 10px 6px; color: #5b6472; font-size: 12px">A connector is a separate program for one engine. Tabloxide asks before it downloads a connector.</p>
</div>
</div>

<div style="display: flex; align-items: center; gap: 8px">
<span style="flex-grow: 1"></span>
<button type="button" style="height: 32px; padding: 0 12px; border-radius: 6px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; border: 1px solid #d5d9e0; background: #ffffff; color: #1b1f27">Cancel</button>
<button type="button" style="height: 32px; padding: 0 12px; border-radius: 6px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; border: 1px solid #d5d9e0; background: #ffffff; color: #1b1f27">Test the connection</button>
<button type="button" style="height: 32px; padding: 0 12px; border-radius: 6px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; border: 1px solid #2563eb; background: #2563eb; color: #ffffff; font-weight: 600">Save</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":760}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
